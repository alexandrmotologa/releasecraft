<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#171536" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#bgGrad)" stroke="#334155" stroke-width="3" />

  <!-- Subtle Precision Grid Arc -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="6 8" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="#1e293b" stroke-width="1" />

  <!-- Git Commit DAG Line under the Mascot -->
  <g stroke="#3b82f6" stroke-width="3" stroke-linecap="round" opacity="0.6">
    <line x1="110" y1="390" x2="200" y2="390" />
    <line x1="200" y1="390" x2="270" y2="345" />
    <line x1="200" y1="390" x2="310" y2="390" />
    <line x1="310" y1="390" x2="400" y2="390" />
  </g>
  <!-- DAG Commit Nodes -->
  <circle cx="110" cy="390" r="7" fill="#1e293b" stroke="#60a5fa" stroke-width="3" />
  <circle cx="200" cy="390" r="7" fill="#1e293b" stroke="#60a5fa" stroke-width="3" />
  <circle cx="270" cy="345" r="8" fill="#4f46e5" stroke="#38bdf8" stroke-width="3" />
  <circle cx="310" cy="390" r="7" fill="#1e293b" stroke="#60a5fa" stroke-width="3" />
  <circle cx="400" cy="390" r="7" fill="#1e293b" stroke="#60a5fa" stroke-width="3" />

  <!-- Release Tag Seal (Carried by the Falcon) -->
  <g transform="translate(230, 305)" filter="url(#subtleShadow)">
    <path d="M 0,-24 L 28,-14 L 38,16 L 14,34 L -14,34 L -38,16 L -28,-14 Z" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="3" />
    <circle cx="0" cy="8" r="8" fill="url(#goldGrad)" />
    <!-- Tag Ribbon knot -->
    <path d="M 0,-24 L 0,-40" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" />
  </g>

  <!-- Precision Raptor / Falcon Mascot Silhouette & Plates -->
  <g filter="url(#subtleShadow)">
    <!-- Back Feather Mantle / Wing Tier 1 -->
    <path d="M 170,220 L 220,160 L 280,185 L 240,265 L 180,285 Z" fill="#1e293b" stroke="#334155" stroke-width="2" />

    <!-- Wing Tier 2 (Primary Flight Feathers) -->
    <path d="M 180,240 L 130,340 L 175,340 L 225,270 Z" fill="url(#primaryGrad)" />
    <path d="M 155,290 L 105,370 L 145,370 L 195,305 Z" fill="#3730a3" />

    <!-- Breast Armor Plates -->
    <path d="M 270,175 L 330,215 L 305,295 L 255,295 L 245,230 Z" fill="url(#accentGrad)" />
    <path d="M 330,215 L 350,265 L 305,295 Z" fill="#1d4ed8" />

    <!-- Crest / Crown Feathers -->
    <path d="M 230,135 L 275,100 L 295,120 L 285,145 Z" fill="#3b82f6" />
    <path d="M 205,150 L 250,115 L 270,135 Z" fill="#1e40af" />

    <!-- Head Plate -->
    <path d="M 255,120 L 325,125 L 345,160 L 285,185 Z" fill="#f8fafc" />

    <!-- Falcon Mask (Dark ocular stripe) -->
    <path d="M 290,140 L 338,145 L 345,170 L 315,185 L 295,165 Z" fill="#0f172a" />

    <!-- Sharp Eye (Alert Cyan Optic) -->
    <circle cx="318" cy="152" r="5.5" fill="#38bdf8" />
    <circle cx="319" cy="151" r="2" fill="#ffffff" />

    <!-- Golden Beak with Tomium Notch -->
    <path d="M 345,140 L 385,155 L 345,180 L 340,162 Z" fill="url(#goldGrad)" stroke="#b45309" stroke-width="1.5" />
    <path d="M 345,140 L 355,155 L 340,162 Z" fill="#fef3c7" opacity="0.4" />

    <!-- Throat Feathers -->
    <path d="M 320,185 L 345,205 L 305,230 L 285,195 Z" fill="#e2e8f0" />

    <!-- Talons Grasping the Release Ring -->
    <path d="M 235,295 L 230,320 L 220,320" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M 245,295 L 245,322 L 238,322" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M 255,295 L 260,320 L 268,318" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" fill="none" />
  </g>
</svg>

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "releasecraft"
version = "0.1.0"
description = "Semantic Git release manager and changelog engine with interactive TUI"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Alexandru Motologa", email = "68332976+alexandrmotologa@users.noreply.github.com" }
]
keywords = [
    "git",
    "semver",
    "release",
    "changelog",
    "conventional-commits",
    "tui",
    "textual",
    "cli",
    "github-releases",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Version Control :: Git",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "gitpython>=3.1.41",
    "semver>=3.0.2",
    "textual>=0.70.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.scripts]
releasecraft = "releasecraft.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/releasecraft"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
norecursedirs = [".venv", "dist", "build"]
pythonpath = ["src"]
asyncio_mode = "auto"
